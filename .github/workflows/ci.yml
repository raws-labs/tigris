name: Compiler CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  quality-and-package:
    name: Lint, package, CLI, and generated C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: raws-labs/tigris-runtime
          path: tigris-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts/ci_codegen_smoke.py
      - run: python -m pytest -q tests/test_codegen_c_syntax.py
      - run: python -m build
      - run: python -m venv /tmp/tigris-wheel-smoke
      - run: /tmp/tigris-wheel-smoke/bin/python -m pip install dist/*.whl
      - run: /tmp/tigris-wheel-smoke/bin/tigris --help
      - run: python scripts/ci_codegen_smoke.py /tmp/tigris-smoke.c
      - run: >-
          cc -std=c99 -Wall -Wextra -Werror -fsyntax-only
          -Itigris-runtime/include /tmp/tigris-smoke.c
      - run: python scripts/crossrepo_contract.py --runtime tigris-runtime
