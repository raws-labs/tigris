name: Compiler CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  quality-and-package:
    name: Lint, package, CLI, and generated C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: raws-labs/tigris-runtime
          path: tigris-runtime
          # Develop is the integration baseline.  A same-named runtime branch,
          # when present, is selected below for coordinated wire-format work.
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Use matching runtime integration branch when available
        env:
          RUNTIME_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if git -C tigris-runtime ls-remote --exit-code --heads origin "$RUNTIME_REF"; then
            git -C tigris-runtime fetch --depth=1 origin "$RUNTIME_REF"
            git -C tigris-runtime checkout --detach FETCH_HEAD
          fi
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q tests/test_codegen_c_syntax.py
      - run: python -m build
      - run: python -m venv /tmp/tigris-wheel-smoke
      - run: /tmp/tigris-wheel-smoke/bin/python -m pip install dist/*.whl
      - run: /tmp/tigris-wheel-smoke/bin/tigris --help
      - run: python scripts/ci_codegen_smoke.py /tmp/tigris-smoke.c
      - run: >-
          cc -std=c99 -Wall -Wextra -Werror -fsyntax-only
          -Itigris-runtime/include /tmp/tigris-smoke.c
      - name: Verify generated plan-schema package
        run: >-
          python scripts/generate_schema_package.py
          --check src/tigris/schema/tigris-plan-v5.json
      - name: Verify generated operator/backend capability package
        run: >-
          python scripts/generate_capability_matrix.py
          --check src/tigris/schema/operator-capabilities-v1.json
      - name: Audit capability package against runtime dispatch
        run: python scripts/validate_runtime_capabilities.py --runtime tigris-runtime
      - name: Verify compiler/runtime compatibility metadata
        run: python scripts/validate_compatibility.py --runtime tigris-runtime
      - name: Run compiler/runtime differential contract
        run: python scripts/crossrepo_contract.py --runtime tigris-runtime
