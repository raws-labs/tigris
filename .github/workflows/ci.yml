name: Compiler CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    if: github.event_name == 'pull_request' || github.event_name == 'release' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/wheels.yml

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - uses: ./.github/actions/runtime
        with:
          build-host: 'true'
      - run: python -m pytest -q

  quality-and-package:
    name: Lint, CLI, and generated C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - uses: ./.github/actions/runtime
      - run: python -m ruff check src tests scripts setup.py
      - run: python -m pytest -q tests/test_codegen_c_syntax.py
      - run: tigris --help
      - run: python scripts/ci_codegen_smoke.py /tmp/tigris-smoke.c
      - run: >-
          cc -std=c99 -Wall -Wextra -Werror -fsyntax-only
          -Iruntime-source/include /tmp/tigris-smoke.c
      - name: Verify generated plan-schema package
        # Named from SCHEMA_VERSION so a bump cannot leave this step checking
        # the previous version's artifact while the current one goes unverified.
        run: >-
          python scripts/generate_schema_package.py --check
          "src/tigris/schema/tigris-plan-v$(python -c
          'import tigris; print(tigris.SCHEMA_VERSION)').json"
      - name: Verify generated operator/backend capability package
        run: >-
          python scripts/generate_capability_matrix.py
          --check src/tigris/schema/operator-capabilities-v1.json
      - name: Audit capability package against runtime dispatch
        run: python scripts/validate_runtime_capabilities.py --runtime runtime-source
      - name: Verify compiler/runtime compatibility metadata
        run: python scripts/validate_compatibility.py --runtime runtime-source
      - name: Run compiler/runtime differential contract
        run: python scripts/crossrepo_contract.py --runtime runtime-source
