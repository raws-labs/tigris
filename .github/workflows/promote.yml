name: Promote to main

# Fast-forwards main to a tested develop commit for a release. main never gets
# its own commits, so it stays an ancestor of develop and a release tag on main
# is reachable from develop. The tag itself is created with the GitHub release.
# The compiler and runtime repositories keep this file identical, so the
# version check has one branch for each.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full develop commit to release
        required: true
      version:
        description: Release version X.Y.Z
        required: true
      dry_run:
        description: Run every check and test the push without moving main
        type: boolean
        default: true

permissions:
  contents: read
  checks: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: promote
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Check inputs and ancestry
        env:
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit SHA" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z" >&2; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/develop || { echo "$SHA is not on develop" >&2; exit 1; }
          git merge-base --is-ancestor origin/main "$SHA" || { echo "main cannot fast-forward to $SHA" >&2; exit 1; }

      - name: Check the release version
        env:
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          git checkout --quiet --detach "$SHA"
          if [ -f scripts/check_version_sources.py ]; then
            # Runtime: its CMake, ESP component, example and consumer versions.
            python3 scripts/check_version_sources.py --expect "$VERSION"
          elif [ -f runtime-host.json ]; then
            # Compiler: the pinned host runtime release.
            pinned="$(python3 -c 'import json; print(json.load(open("runtime-host.json"))["release"])')"
            [ "$pinned" = "v$VERSION" ] || { echo "runtime-host.json pins $pinned, not v$VERSION" >&2; exit 1; }
          fi

      - name: Check that published consumers accept the plan schemas
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -f scripts/check_version_sources.py ]; then
            # Runtime: every zoo artifact that declares this release compatible
            # has a schema the loader still accepts.
            floor="$(printf '#include "tigris.h"\nTIGRIS_SCHEMA_VERSION_MIN\n' | cc -E -P -I include -x c - | tail -n 1)"
            curl -fsSL https://huggingface.co/raws-labs/tigris-zoo/resolve/main/catalog.json -o "$RUNNER_TEMP/catalog.json"
            python3 - "$floor" "$VERSION" "$RUNNER_TEMP/catalog.json" <<'PY'
          import json, sys
          floor, catalog = int(sys.argv[1]), sys.argv[3]
          def release(text):
              return tuple(int(part) for part in text.split("."))
          version = release(sys.argv[2])
          refused = []
          for artifact in json.load(open(catalog))["artifacts"]:
              runtime = artifact["runtime"]
              if artifact.get("withdrawn") or release(runtime["min"]) > version:
                  continue
              if runtime["max"] is not None and release(runtime["max"]) < version:
                  continue
              if artifact["schema"] < floor:
                  refused.append(f'{artifact["id"]} (schema {artifact["schema"]})')
          print(f"zoo artifacts checked against schema floor {floor}")
          if refused:
              sys.exit("the loader refuses zoo artifacts that declare this release compatible: " + ", ".join(refused))
          PY
          elif [ -f runtime-host.json ]; then
            # Compiler: the runtime that the Cortex-M board support pins accepts
            # the schema this compiler emits.
            schema="$(sed -n 's/^SCHEMA_VERSION = \([0-9][0-9]*\)$/\1/p' src/tigris/__init__.py)"
            pin="$(curl -fsSL https://raw.githubusercontent.com/raws-labs/tigris-cortex-m/main/cmake/deps.cmake \
              | sed -n '/FetchContent_Declare(tigris_runtime/,/)/s/.*GIT_TAG \([0-9a-f]\{40\}\).*/\1/p')"
            [ -n "$schema" ] && [ -n "$pin" ] || { echo "schema or runtime pin not found" >&2; exit 1; }
            mkdir -p "$RUNNER_TEMP/pinned"
            for header in tigris.h tigris_config.h; do
              curl -fsSL "https://raw.githubusercontent.com/raws-labs/tigris-runtime/$pin/include/$header" \
                -o "$RUNNER_TEMP/pinned/$header"
            done
            echo "plan schema $schema against tigris-cortex-m's runtime pin $pin"
            printf '#include "tigris.h"\n_Static_assert(TIGRIS_SCHEMA_VERSION_MIN <= SCHEMA && SCHEMA <= TIGRIS_SCHEMA_VERSION, "the runtime tigris-cortex-m pins refuses this plan schema");\n' \
              | cc -std=c11 -fsyntax-only -DSCHEMA="$schema" -I "$RUNNER_TEMP/pinned" -x c -
          fi

      - name: Check that CI passed on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            --jq '.check_runs[] | select(.name != "promote") | [.name, .status, (.conclusion // "")] | @tsv' > runs.tsv
          cat runs.tsv
          [ -s runs.tsv ] || { echo "no CI runs on $SHA" >&2; exit 1; }
          if awk -F'\t' '$2 != "completed" || ($3 != "success" && $3 != "skipped" && $3 != "neutral")' runs.tsv | grep -q .; then
            echo "CI has not passed on $SHA" >&2
            exit 1
          fi

      - name: Fast-forward main
        env:
          SHA: ${{ inputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOY_KEY: ${{ secrets.PROMOTE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/promote
          chmod 600 ~/.ssh/promote
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "no GitHub SSH host keys" >&2; exit 1; }
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/promote -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          args=()
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          git push "${args[@]}" "git@github.com:$GITHUB_REPOSITORY.git" "$SHA:refs/heads/main"
